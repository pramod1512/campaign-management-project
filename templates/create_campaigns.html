<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Campaign - ActNOW</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:       #2E8B57;
      --green-light: #52c987;
      --green-pale:  #e8f8f0;
      --blue:        #0077cc;
      --blue-light:  #e6f3ff;
      --text:        #1a1a2e;
      --muted:       #666;
      --white:       #ffffff;
      --bg:          #f4f9f6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: var(--white);
      padding: 14px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 200;
    }

    .logo { font-size: 24px; font-weight: 800; color: var(--green); letter-spacing: 1px; text-decoration: none; }
    .logo span { color: var(--blue); }

    nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    nav a { color: var(--text); text-decoration: none; padding: 7px 14px; border-radius: 20px; font-weight: 600; font-size: 14px; transition: all 0.25s ease; }
    nav a:hover { background: var(--green-pale); color: var(--green); }
    .nav-user-badge { background: var(--green-pale); color: var(--green); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; }
    .nav-logout { background: #fdecea !important; color: #c0392b !important; }
    .nav-logout:hover { background: #c0392b !important; color: white !important; }

    /* ── PAGE TITLE ── */
    .page-title { text-align: center; padding: 32px 16px 8px; }
    .page-title .tag { display: inline-block; background: var(--green-pale); color: var(--green); padding: 5px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-bottom: 10px; }
    .page-title h1 { font-size: 26px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .page-title p  { font-size: 14px; color: var(--muted); }

    /* ── FORM CARD ── */
    .form-card {
      background: var(--white);
      width: 100%; max-width: 560px;
      margin: 24px auto 48px;
      padding: 36px 38px;
      border-radius: 20px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.09);
      animation: fadeUp 0.4s ease;
    }

    .form-group { margin-bottom: 18px; }

    label { display: block; font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 6px; }

    input, textarea, select {
      width: 100%; padding: 11px 14px; border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 14px; font-family: inherit; color: var(--text);
      background: var(--bg); transition: border 0.3s, box-shadow 0.3s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--green); box-shadow: 0 0 0 3px rgba(46,139,87,0.12);
      outline: none; background: white;
    }

    textarea { resize: vertical; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* Image preview */
    .img-preview {
      width: 100%; height: 160px; border-radius: 10px; object-fit: cover;
      margin-top: 10px; display: none; border: 1.5px solid #ddd;
    }

    /* Submit */
    .submit-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--green), var(--green-light));
      color: white; border: none; border-radius: 10px; font-size: 15px;
      font-weight: 700; cursor: pointer; margin-top: 8px; transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(46,139,87,0.3);
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(46,139,87,0.4); }

    /* Back link */
    .back-link { display: block; text-align: center; margin-bottom: 32px; color: var(--muted); font-size: 13px; font-weight: 600; text-decoration: none; transition: color 0.2s; }
    .back-link:hover { color: var(--green); }

    /* ── FOOTER ── */
    footer { background: var(--text); color: #aaa; text-align: center; padding: 20px; font-size: 13px; margin-top: auto; }
    footer span { color: var(--green-light); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 600px) {
      header { padding: 12px 20px; }
      .form-card { margin: 16px; padding: 24px 20px; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo">Act<span>Now</span></a>
  <nav>
    <a href="/">Home</a>
    <a href="/organizer_dashboard">Dashboard</a>
    <a href="/manage_campaigns">My Campaigns</a>
    <span class="nav-user-badge">🏢 {{ session.get('org_name', 'Organizer').split()[0] }}</span>
    <a href="/logout" class="nav-logout">Logout</a>
  </nav>
</header>

<div class="page-title">
  <div class="tag">🌿 Organizer Panel</div>
  <h1>Create New Campaign</h1>
  <p>Fill in the details below to launch your campaign</p>
</div>

<div class="form-card">
  <form method="POST" action="/create_newcampaign" enctype="multipart/form-data">

    <div class="form-group">
      <label>Campaign Title</label>
      <input type="text" name="title" placeholder="e.g. Tree Plantation Drive 2025" required>
    </div>

    <div class="form-group">
      <label>Organized By</label>
      <input type="text" name="organizer" placeholder="Your name or organization" required>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea name="description" rows="4" placeholder="Tell volunteers what this campaign is about..." required></textarea>
    </div>

    <div class="form-group">
      <label>Address / Venue</label>
      <input type="text" name="address" placeholder="Full address or venue name" required>
    </div>

    <div class="row">
      <div class="form-group">
        <label>State</label>
        <select name="state" required>
          <option value="">-- Select State --</option>
          <option>Maharashtra</option>
          <option>Gujarat</option>
          <option>Karnataka</option>
          <option>Tamil Nadu</option>
          <option>Kerala</option>
          <option>Rajasthan</option>
          <option>Delhi</option>
          <option>Uttar Pradesh</option>
          <option>Bihar</option>
          <option>Madhya Pradesh</option>
        </select>
      </div>
      <div class="form-group">
        <label>District</label>
        <input type="text" name="district" placeholder="Enter district" required>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" name="date" required>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option value="Active">🟢 Active</option>
          <option value="Inactive">🟡 Inactive</option>
          <option value="Completed">🔵 Completed</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Campaign Image</label>
      <input type="file" name="image" accept="image/*" onchange="previewImage(event)" required>
      <img id="imgPreview" class="img-preview" alt="Preview">
    </div>

    <button type="submit" class="submit-btn">🚀 Create Campaign</button>
  </form>
</div>

<a href="/organizer_dashboard" class="back-link">← Back to Dashboard</a>

<footer>
  <p>&copy; 2025 <span>ActNOW</span> | All Rights Reserved</p>
</footer>

<script>
  function previewImage(event) {
    const preview = document.getElementById('imgPreview');
    const file = event.target.files[0];
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    }
  }
</script>

</body>
</html>
