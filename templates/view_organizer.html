<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ActNow | View Organizers</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:       #2E8B57;
      --green-light: #52c987;
      --green-pale:  #e8f8f0;
      --blue:        #0077cc;
      --blue-light:  #e6f3ff;
      --text:        #1a1a2e;
      --muted:       #666;
      --white:       #ffffff;
      --bg:          #f4f9f6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--white);
      padding: 14px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 200;
    }

    .logo { font-size: 24px; font-weight: 800; color: var(--green); letter-spacing: 1px; text-decoration: none; }
    .logo span { color: var(--blue); }

    .back-btn {
      background: var(--blue-light);
      color: var(--blue);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.3s;
    }
    .back-btn:hover { background: var(--blue); color: white; }

    main {
      flex: 1;
      max-width: 1000px;
      margin: 36px auto;
      padding: 0 24px;
      width: 100%;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 14px;
    }

    .page-header h2 { font-size: 22px; font-weight: 800; color: var(--text); }
    .page-header h2 span { color: var(--green); }

    .count-pill {
      background: var(--green-pale);
      color: var(--green);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    .search-wrap { position: relative; margin-bottom: 20px; }
    .search-wrap span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; }
    .search-wrap input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      background: var(--white);
      color: var(--text);
      transition: border 0.3s, box-shadow 0.3s;
    }
    .search-wrap input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(46,139,87,0.1); outline: none; }

    .table-card {
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.07);
      overflow: hidden;
      animation: fadeUp 0.4s ease;
    }

    table { width: 100%; border-collapse: collapse; }
    thead tr { background: linear-gradient(135deg, var(--green), var(--green-light)); }
    thead th { padding: 14px 18px; text-align: left; font-size: 12px; font-weight: 700; color: white; text-transform: uppercase; letter-spacing: 0.6px; }
    tbody tr { border-bottom: 1px solid #f5f5f5; transition: background 0.2s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--green-pale); }
    tbody td { padding: 13px 18px; font-size: 14px; color: var(--text); vertical-align: middle; }

    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--green), var(--green-light));
      color: white; display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; flex-shrink: 0;
    }

    .name-cell { display: flex; align-items: center; gap: 12px; }
    .name-cell strong { font-weight: 600; }

    .role-badge {
      background: var(--green-pale);
      color: var(--green);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    footer { background: var(--text); color: #aaa; text-align: center; padding: 20px; font-size: 13px; margin-top: auto; }
    footer span { color: var(--green-light); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 600px) { header { padding: 12px 20px; } main { padding: 0 16px; margin-top: 24px; } }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo">Act<span>Now</span></a>
  <a href="/admin_dashboard" class="back-btn">← Dashboard</a>
</header>

<main>
  <div class="page-header">
    <h2>🧑‍💼 <span>Organizers</span></h2>
    <span class="count-pill" id="countPill">Loading...</span>
  </div>

  <div class="search-wrap">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Search by name or email..." oninput="filterTable()">
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Organizer</th>
          <th>Email</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        {% for info in result %}
        <tr>
          <td style="color:var(--muted); font-weight:600;">{{ loop.index }}</td>
          <td>
            <div class="name-cell">
              <div class="avatar">{{ info[1][0].upper() }}</div>
              <strong>{{ info[1] }}</strong>
            </div>
          </td>
          <td style="color:var(--muted);">{{ info[2] }}</td>
          <td><span class="role-badge">{{ info[4] }}</span></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</main>

<footer>
  <p>&copy; 2025 <span>ActNOW</span> | Admin Panel</p>
</footer>

<script>
  const rows = document.querySelectorAll('#tableBody tr');
  document.getElementById('countPill').textContent = rows.length + ' registered';

  function filterTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    let visible = 0;
    rows.forEach(row => {
      const show = row.textContent.toLowerCase().includes(q);
      row.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    document.getElementById('countPill').textContent = visible + ' registered';
  }
</script>

</body>
</html>
